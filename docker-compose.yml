version: "3.9"

services:
  ai-document-retrieval-system:
    build: .
    container_name: ai-document-retrieval-system
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
